include:
  - docker-compose.tools.yml
services:
  ordering:
    image: shop/ordering:dev
    restart: no
    ports:
      - 8080:8080
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
    environment:
      SPRING_PROFILES_ACTIVE: docker
  billing:
    image: shop/billing:dev
    restart: no
    ports:
      - 8082:8082
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
    environment:
      SPRING_PROFILES_ACTIVE: docker